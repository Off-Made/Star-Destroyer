<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Star Destroyer" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <title>Star Destroyer</title>
</head>
<body>
  <div id="app">
    <div id="probe"></div>
    <canvas id="screen" width="224" height="288" aria-label="Area di gioco"></canvas>
    <div id="crt"></div>

    <!-- Barra della home: musica e opzioni (le etichette in pixel font sono generate da JS) -->
    <div id="bar">
      <button id="bMusic" class="rbtn" aria-label="Musica">MUSICA</button>
      <button id="bSettings" class="rbtn" aria-label="Opzioni">OPZIONI</button>
    </div>

    <!-- In partita: solo il tastino pausa, nell'angolo dell'HUD -->
    <button id="bPause" class="rbtn icon" aria-label="Pausa"></button>

    <!-- Controlli touch: movimento SOLO trascinando, FIRE per sparare -->
    <div id="pad" class="zone"><span id="padLabel"></span></div>
    <div id="fire" class="zone" aria-label="Fuoco"></div>

    <!-- Home: la partita parte SOLO da START (o Invio / Start del gamepad) -->
    <button id="homeStart" aria-label="Inizia la partita">START</button>
    <div id="homeHelp" class="retro-box">
      <div class="hh-title" data-px="COME SI GIOCA" data-col="Y"></div>
      <div class="hh-row" data-px="TRASCINA PER MUOVERTI" data-col="C"></div>
      <div class="hh-row" data-px="TIENI PREMUTO FIRE" data-col="R"></div>
      <div class="hh-row" data-px="BATTI IL TUO RECORD" data-col="M"></div>
    </div>

    <!-- Menu di pausa -->
    <div id="pauseMenu" class="overlay hidden" role="dialog" aria-label="Pausa">
      <div class="retro-panel menu">
        <div class="menu-title" data-px="PAUSA" data-col="Y"></div>
        <button id="mHome" class="rbtn big"></button>
        <button id="mMusic" class="rbtn big"></button>
        <button id="mResume" class="rbtn big primary"></button>
      </div>
    </div>

    <div id="settings" class="overlay hidden" role="dialog" aria-label="Opzioni">
      <div class="retro-panel">
        <div class="menu-title" data-px="OPZIONI" data-col="Y"></div>
        <label>Trascinamento
          <select id="sDragMode"><option value="relative">Relativo (sposta di quanto muovi il dito)</option><option value="absolute">Assoluto (la nave segue il dito)</option></select>
        </label>
        <label>Sensibilità <span id="sSensV"></span>
          <input id="sSens" type="range" min="0.5" max="3" step="0.1" />
        </label>
        <label class="row"><input id="sAuto" type="checkbox" /> Auto-fire tenendo premuto</label>
        <label class="row"><input id="sSfx" type="checkbox" /> Effetti sonori</label>
        <label class="row"><input id="sVibe" type="checkbox" /> Vibrazione (Android)</label>
        <label class="row"><input id="sCrt" type="checkbox" /> Effetto CRT / scanline</label>
        <button id="sClose" class="rbtn big" data-px="CHIUDI" data-col="Y"></button>
      </div>
    </div>

    <div id="install" class="overlay hidden">
      <div class="retro-panel">
        <div class="menu-title" data-px="SCHERMO INTERO" data-col="Y"></div>
        <p id="installText"></p>
        <button id="installBtn" class="rbtn big hidden" data-px="INSTALLA" data-col="L"></button>
        <button id="installClose" class="rbtn big" data-px="OK" data-col="Y"></button>
      </div>
    </div>

    <div id="rotate" class="hidden">Ruota il telefono in verticale per la migliore esperienza</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
